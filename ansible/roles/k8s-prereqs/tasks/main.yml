- name: Disable swap
  command: swapoff -a
  become: true

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
  become: true

- name: Load kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]
  become: true